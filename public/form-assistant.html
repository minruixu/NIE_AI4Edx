<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Form Assistant - NTU GenAI Research Portal</title>
    <link rel="icon" href="./favicon.ico" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f8f9fa;
        }

        .header {
            background: linear-gradient(135deg, #003d7c 0%, #0056b3 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 700;
        }

        .header p {
            margin: 10px 0 0 0;
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
        }

        .form-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            overflow-y: auto;
            max-height: 90vh;
        }

        .chat-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 96.5vh;
            position: sticky;
            top: 15px;
        }

        .chat-header {
            background: #003d7c;
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            border-bottom: 1px solid #eee;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 85%;
            word-wrap: break-word;
            animation: messageSlide 0.3s ease-out;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            background: #003d7c;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .bot-message {
            background: #f1f3f4;
            color: #333;
            margin-right: auto;
        }

        .chat-input-container {
            padding: 20px;
            border-top: 1px solid #eee;
        }

        .chat-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            resize: none;
            font-family: inherit;
        }

        .chat-input:focus {
            border-color: #003d7c;
            box-shadow: 0 0 0 2px rgba(0, 61, 124, 0.1);
        }

        .send-button {
            background: #003d7c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin-left: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
        }

        .send-button:hover {
            background: #0056b3;
        }

        .form-field {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }

        .field-label {
            font-weight: bold;
            color: #003d7c;
            margin-bottom: 8px;
            display: block;
        }

        .field-input {
            width: 98%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background: white;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: #666;
            font-style: italic;
        }

        .typing-dots {
            display: inline-flex;
            margin-left: 8px;
        }

        .typing-dots span {
            height: 6px;
            width: 6px;
            background-color: #666;
            border-radius: 50%;
            display: inline-block;
            margin: 0 1px;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .quick-action-btn {
            background: #e9ecef;
            border: 1px solid #ccc;
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quick-action-btn:hover {
            background: #003d7c;
            color: white;
            border-color: #003d7c;
        }

        .chat-quick-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
        }

        .form-preview {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: white;
        }

        .declaration-section {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .checkbox-field {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            background: #f8f9fa;
        }

        .api-key-section {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .api-key-input {
            width: 93%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .chat-section {
                height: 60vh;
                position: relative;
                top: 0;
            }
        }

        .nav-header {
            background: #fff;
            padding: 10px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-header img {
            height: 40px;
            width: auto;
        }

        .nav-link {
            color: #003d7c;
            text-decoration: none;
            fontWeight: 600;
            fontSize: 1em;
            padding: 8px 16px;
            border: 1px solid #003d7c;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            background-color: #003d7c;
            color: white;
        }

        .analysis-result {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 61, 124, 0.1);
            border-radius: 8px;
        }

        .apply-button {
            background: #003d7c;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            fontSize: 12px;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s ease;
        }

        .apply-button:hover {
            background: #0056b3;
        }

        .success-message {
            background: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724 !important;
        }

        .error-message {
            background: #f8d7da !important;
            border-color: #f5c6cb !important;
            color: #721c24 !important;
        }

        .download-section {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }

        .download-button {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 4px rgba(40, 167, 69, 0.2);
        }

        .download-button:hover {
            background: linear-gradient(135deg, #218838 0%, #1ea085 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(40, 167, 69, 0.3);
        }

        .download-icon {
            font-size: 16px;
        }

        .user-guide {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
        }

        .guide-step {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            transition: all 0.3s ease;
        }

        .guide-step:hover {
            box-shadow: 0 2px 8px rgba(0, 61, 124, 0.1);
            border-color: #003d7c;
        }

        .step-number {
            background: #003d7c;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }

        .step-content h4 {
            margin: 0 0 8px 0;
            color: #003d7c;
            font-size: 16px;
        }

        .step-content p {
            margin: 0;
            color: #666;
            font-size: 14px;
            line-height: 1.4;
        }

        .use-case-section {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .use-case {
            background: white;
            border-radius: 6px;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #003d7c;
        }

        .use-case h5 {
            margin: 0 0 8px 0;
            color: #003d7c;
            font-size: 14px;
            font-weight: 600;
        }

        .use-case p {
            margin: 0;
            font-size: 13px;
            color: #555;
            font-style: italic;
        }

        .objective-section {
            background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
            border: 1px solid #ffeaa7;
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
            text-align: center;
        }

        .objective-section h2 {
            color: #856404;
            margin: 0 0 15px 0;
            font-size: 24px;
        }

        .objective-section p {
            color: #856404;
            margin: 0;
            font-size: 16px;
            line-height: 1.5;
        }

        .download-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .download-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 4px rgba(40, 167, 69, 0.2);
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #218838 0%, #1ea085 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(40, 167, 69, 0.3);
        }

        .progress-indicator {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            padding: 0 10px;
        }

        .progress-step {
            flex: 1;
            text-align: center;
            position: relative;
        }

        .progress-step:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 15px;
            right: -50%;
            width: 100%;
            height: 2px;
            background: #ddd;
            z-index: 1;
        }

        .progress-step.completed::after {
            background: #28a745;
        }

        .progress-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ddd;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-size: 12px;
            font-weight: bold;
            position: relative;
            z-index: 2;
        }

        .progress-step.completed .progress-circle {
            background: #28a745;
        }

        .progress-step.active .progress-circle {
            background: #003d7c;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 61, 124, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 61, 124, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 61, 124, 0); }
        }

        .progress-label {
            font-size: 11px;
            color: #666;
            font-weight: 500;
        }

        .collapsible-section {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin: 10px 0;
            overflow: hidden;
        }

        .collapsible-header {
            background: #f8f9fa;
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            transition: background-color 0.2s ease;
        }

        .collapsible-header:hover {
            background: #e9ecef;
        }

        .collapsible-content {
            padding: 20px;
            display: none;
        }

        .collapsible-content.open {
            display: block;
        }

        .toggle-icon {
            transition: transform 0.3s ease;
        }

        .toggle-icon.open {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Add jsPDF library for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Form data structure based on the NIE form
        const formFields = [
            { id: 'courseCode', label: 'Course Code and Title', type: 'text', required: true },
            { id: 'programme', label: 'Programme', type: 'text', required: true },
            { id: 'assignmentTitle', label: 'Assignment Title', type: 'text', required: true },
            { id: 'studentName', label: "Student's Name(s) [Official]", type: 'text', required: true },
            { id: 'classTime', label: 'Class Day/Time', type: 'text', required: true },
            { id: 'lecturerName', label: "Lecturer's Name", type: 'text', required: true },
            { id: 'turnitinIndex', label: 'Turnitin Similarity Index (%)', type: 'number', required: true },
        ];

        const gaiDeclarationOptions = [
            { id: 'noGAI', text: 'Not used GAI assistance in any way in the development or generation of this assignment.' },
            { id: 'keyIdeas', text: 'Used GAI as permitted to assist in generating key ideas only.' },
            { id: 'firstText', text: 'Used GAI as permitted to assist in generating a first text only.' },
            { id: 'visual', text: 'Used GAI to generate an accompanying visual for my written submission.' },
            { id: 'translation', text: 'Used GAI to translate my creative submission from another language to English.' },
            { id: 'grammar', text: 'Used GAI to refine syntax and grammar for correct language submission only.' },
        ];

        // Simple LLM API call (you might want to replace this with your preferred API)
        const callLLM = async (message, apiKey) => {
            if (!apiKey) {
                return "Please provide an API key to use the AI assistant feature. You can get one from OpenAI and enter it in the API Key field above.";
            }

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4.1-mini',
                        messages: [
                            {
                                role: 'system',
                                content: 'You are a helpful assistant for NIE students filling out their Assignment Cover Sheet and GAI Declaration forms. Help them understand each field and provide guidance on academic integrity requirements. Be concise but thorough.'
                            },
                            { role: 'user', content: message }
                        ],
                        max_tokens: 1000,
                        temperature: 1
                    })
                });

                if (!response.ok) {
                    throw new Error(`API call failed: ${response.status}`);
                }

                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                console.error('LLM API Error:', error);
                return `I'm having trouble connecting to the AI service right now. Error: ${error.message}. Please try again later or contact support if the issue persists.`;
            }
        };

        // AI Usage Analysis function
        const analyzeAIUsage = async (usageDescription, apiKey) => {
            if (!apiKey) {
                return {
                    error: "Please provide an API key to use the AI analysis feature."
                };
            }

            const systemPrompt = `You are an AI assistant specialized in analyzing student descriptions of AI tool usage for academic assignments. Your task is to analyze a student's description and categorize it based on a provided list of options. 

Available Declaration Options:
1. noGAI: "Not used GAI assistance in any way in the development or generation of this assignment."
2. keyIdeas: "Used GAI as permitted to assist in generating key ideas only."
3. firstText: "Used GAI as permitted to assist in generating a first text only."
4. visual: "Used GAI to generate an accompanying visual for my written submission."
5. translation: "Used GAI to translate my creative submission from another language to English."
6. grammar: "Used GAI to refine syntax and grammar for correct language submission only."

Your Instructions:
1.  Carefully read the student's description of how they used AI.
2.  Identify all parts of their description that match one or more of the \`Available Declaration Options\`. List the corresponding IDs in the \`matchedOptions\` array.
3.  Identify any parts of the student's description that **do not** match any of the available options. Concatenate these specific, un-matched descriptions into a single string. This string should be a direct summary or quote of their non-standard usage. Place this in the \`additionalInfo\` field. If all described usage is covered, this field should be an empty string.
4.  Set \`hasUnmatchedUsage\` to \`true\` if \`additionalInfo\` is not empty, otherwise \`false\`.
5.  Provide a brief, user-friendly \`explanation\` of your analysis, summarizing what was matched and what needs to be detailed further.

You MUST respond in a valid JSON format.

Response Format (JSON):
{
  "matchedOptions": ["id1", "id2"],
  "additionalInfo": "A summary of the student's described AI usage that was not covered by the options.",
  "explanation": "A brief explanation of the analysis.",
  "hasUnmatchedUsage": true
}

Example:
Student description: "I used ChatGPT to brainstorm some topics for my paper and also used DALL-E to create a cover image. I also had it write the conclusion for me."
Expected JSON output:
{
  "matchedOptions": ["keyIdeas", "visual"],
  "additionalInfo": "Used AI to write the conclusion for the paper.",
  "explanation": "I've identified that you used AI for brainstorming (key ideas) and creating a visual. Your usage of AI to write the conclusion is not covered by the standard options and should be detailed in the 'More about My GenAI Usage' section.",
  "hasUnmatchedUsage": true
}`;

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4.1-mini',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: `Please analyze this AI usage description: "${usageDescription}"` }
                        ],
                        max_tokens: 5000,
                        temperature: 0.3
                    })
                });

                if (!response.ok) {
                    throw new Error(`API call failed: ${response.status}`);
                }

                const data = await response.json();
                try {
                    return JSON.parse(data.choices[0].message.content);
                } catch (parseError) {
                    return {
                        error: "Failed to parse AI response",
                        rawResponse: data.choices[0].message.content
                    };
                }
            } catch (error) {
                console.error('AI Usage Analysis Error:', error);
                return {
                    error: `Analysis failed: ${error.message}`
                };
            }
        };

        const FormAssistant = () => {
            const [formData, setFormData] = useState({});
            const [gaiSelections, setGaiSelections] = useState([]);
            const [messages, setMessages] = useState([
                {
                    sender: 'bot',
                    text: 'Welcome! I\'m your AI Assistant for the NIE Assignment Cover Sheet. Follow the 5-step process above to complete your declaration. Start by entering your OpenAI API key, then click "AI Declaration" to begin!'
                }
            ]);
            const [currentMessage, setCurrentMessage] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [apiKey, setApiKey] = useState('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');
            const [analysisResults, setAnalysisResults] = useState(null);
            const [currentStep, setCurrentStep] = useState(1);
            const [showGuide, setShowGuide] = useState(true);
            const [showUseCases, setShowUseCases] = useState(false);
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            const generatePDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                // Header
                doc.setFontSize(20);
                doc.setTextColor(0, 61, 124);
                doc.text('NIE Assignment Cover Sheet & GAI Declaration', 20, 30);
                
                // Date
                doc.setFontSize(10);
                doc.setTextColor(100, 100, 100);
                doc.text(`Generated on: ${new Date().toLocaleDateString()}`, 20, 45);
                
                let yPosition = 50;
                
                // Form Data
                doc.setFontSize(14);
                doc.setTextColor(0, 61, 124);
                doc.text('Assignment Information', 20, yPosition);
                yPosition += 10;
                
                doc.setFontSize(10);
                doc.setTextColor(0, 0, 0);
                
                formFields.forEach(field => {
                    if (formData[field.id]) {
                        doc.text(`${field.label}: ${formData[field.id]}`, 20, yPosition);
                        yPosition += 8;
                    }
                });
                
                yPosition += 10;
                
                // GAI Declaration
                doc.setFontSize(14);
                doc.setTextColor(0, 61, 124);
                doc.text('GAI Declaration', 20, yPosition);
                yPosition += 10;
                
                doc.setFontSize(10);
                doc.setTextColor(0, 0, 0);
                
                if (gaiSelections.length > 0) {
                    gaiSelections.forEach(selectionId => {
                        const option = gaiDeclarationOptions.find(opt => opt.id === selectionId);
                        if (option) {

                            padding: '12px 20px',
                            fontSize: '14px',
                            fontWeight: '600',
                            cursor: (gaiSelections.length || formData.otherGAIUsage) ? 'pointer' : 'not-allowed',
                            transition: 'all 0.3s ease',
                            boxShadow: (gaiSelections.length || formData.otherGAIUsage) ? '0 2px 10px rgba(144, 205, 244, 0.3)' : 'none',
                            position: 'relative',
                            minWidth: '140px',
                            fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
                        }}
                        onMouseOver={(e) => {
                            if (gaiSelections.length || formData.otherGAIUsage) {
                                e.target.style.transform = 'translateY(-2px)';
                                e.target.style.boxShadow = '0 6px 20px rgba(144, 205, 244, 0.4)';
                                e.target.style.background = 'linear-gradient(120deg, #a78bfa 0%, #90cdf4 100%)';
                                e.target.style.borderColor = '#f7fafc';
                            }
                        }}
                        onMouseOut={(e) => {
                            if (gaiSelections.length || formData.otherGAIUsage) {
                                e.target.style.transform = 'translateY(0)';
                                e.target.style.boxShadow = '0 2px 10px rgba(144, 205, 244, 0.3)';
                                e.target.style.background = 'linear-gradient(120deg, #90cdf4 0%, #a78bfa 100%)';
                                e.target.style.borderColor = '#ffffff';
                            }
                        }}
                    >
                        <span style={{
                            display: 'flex',
                            alignItems: 'center',
                            gap: '8px',
                            justifyContent: 'center'
                        }}>
                            <span style={{fontSize: '16px'}}>📋</span>
                            <span>Generate PDF</span>
                        </span>
                    </button>
                </div>
                {!apiKey && (
                    <p style={{margin: '10px 0 0 0', fontSize: '11px', color: '#e74c3c', fontStyle: 'italic'}}>
                        ⚠️ Please enter API key first to enable AI Declaration
                    </p>
                )}
            </div>

                            <div className="chat-input-container">
                                <div style={{display: 'flex', alignItems: 'flex-end'}}>
                                    <textarea
                                        className="chat-input"
                                        value={currentMessage}
                                        onChange={(e) => setCurrentMessage(e.target.value)}
                                        onKeyPress={handleKeyPress}
                                        placeholder="Ask me about any part of the form..."
                                        rows="2"
                                    />
                                    <button className="send-button" onClick={handleSendMessage}>
                                        ➤
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </>
            );
        };

        const App = () => {
            return <FormAssistant />;
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
