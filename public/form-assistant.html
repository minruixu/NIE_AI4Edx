<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Form Assistant - NTU GenAI Research Portal</title>
    <link rel="icon" href="favicon.ico" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f8f9fa;
        }

        .header {
            background: linear-gradient(135deg, #003d7c 0%, #0056b3 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 700;
        }

        .header p {
            margin: 10px 0 0 0;
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
        }

        .form-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            overflow-y: auto;
            max-height: 80vh;
        }

        .chat-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 80vh;
            position: sticky;
            top: 20px;
        }

        .chat-header {
            background: #003d7c;
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            border-bottom: 1px solid #eee;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 85%;
            word-wrap: break-word;
            animation: messageSlide 0.3s ease-out;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            background: #003d7c;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .bot-message {
            background: #f1f3f4;
            color: #333;
            margin-right: auto;
        }

        .chat-input-container {
            padding: 20px;
            border-top: 1px solid #eee;
        }

        .chat-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            resize: none;
            font-family: inherit;
        }

        .chat-input:focus {
            border-color: #003d7c;
            box-shadow: 0 0 0 2px rgba(0, 61, 124, 0.1);
        }

        .send-button {
            background: #003d7c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin-left: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
        }

        .send-button:hover {
            background: #0056b3;
        }

        .form-field {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }

        .field-label {
            font-weight: bold;
            color: #003d7c;
            margin-bottom: 8px;
            display: block;
        }

        .field-input {
            width: 98%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background: white;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: #666;
            font-style: italic;
        }

        .typing-dots {
            display: inline-flex;
            margin-left: 8px;
        }

        .typing-dots span {
            height: 6px;
            width: 6px;
            background-color: #666;
            border-radius: 50%;
            display: inline-block;
            margin: 0 1px;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .quick-action-btn {
            background: #e9ecef;
            border: 1px solid #ccc;
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quick-action-btn:hover {
            background: #003d7c;
            color: white;
            border-color: #003d7c;
        }

        .form-preview {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: white;
        }

        .declaration-section {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .checkbox-field {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            background: #f8f9fa;
        }

        .api-key-section {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .api-key-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .chat-section {
                height: 60vh;
                position: relative;
                top: 0;
            }
        }

        .nav-header {
            background: #fff;
            padding: 10px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-header img {
            height: 40px;
            width: auto;
        }

        .nav-link {
            color: #003d7c;
            text-decoration: none;
            fontWeight: 600;
            fontSize: 1em;
            padding: 8px 16px;
            border: 1px solid #003d7c;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            background-color: #003d7c;
            color: white;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Form data structure based on the NIE form
        const formFields = [
            { id: 'courseCode', label: 'Course Code and Title', type: 'text', required: true },
            { id: 'programme', label: 'Programme', type: 'text', required: true },
            { id: 'assignmentTitle', label: 'Assignment Title', type: 'text', required: true },
            { id: 'studentName', label: "Student's Name(s) [Official]", type: 'text', required: true },
            { id: 'classTime', label: 'Class Day/Time', type: 'text', required: true },
            { id: 'lecturerName', label: "Lecturer's Name", type: 'text', required: true },
            { id: 'turnitinIndex', label: 'Turnitin Similarity Index (%)', type: 'number', required: true },
        ];

        const gaiDeclarationOptions = [
            { id: 'noGAI', text: 'Not used GAI assistance in any way in the development or generation of this assignment.' },
            { id: 'keyIdeas', text: 'Used GAI as permitted to assist in generating key ideas only.' },
            { id: 'firstText', text: 'Used GAI as permitted to assist in generating a first text only.' },
            { id: 'visual', text: 'Used GAI to generate an accompanying visual for my written submission.' },
            { id: 'translation', text: 'Used GAI to translate my creative submission from another language to English.' },
            { id: 'grammar', text: 'Used GAI to refine syntax and grammar for correct language submission only.' },
        ];

        // Simple LLM API call (you might want to replace this with your preferred API)
        const callLLM = async (message, apiKey) => {
            if (!apiKey) {
                return "Please provide an API key to use the AI assistant feature. You can get one from OpenAI and enter it in the API Key field above.";
            }

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo',
                        messages: [
                            {
                                role: 'system',
                                content: 'You are a helpful assistant for NIE students filling out their Assignment Cover Sheet and GAI Declaration forms. Help them understand each field and provide guidance on academic integrity requirements. Be concise but thorough.'
                            },
                            { role: 'user', content: message }
                        ],
                        max_tokens: 500,
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    throw new Error(`API call failed: ${response.status}`);
                }

                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                console.error('LLM API Error:', error);
                return `I'm having trouble connecting to the AI service right now. Error: ${error.message}. Please try again later or contact support if the issue persists.`;
            }
        };

        const FormAssistant = () => {
            const [formData, setFormData] = useState({});
            const [gaiSelections, setGaiSelections] = useState([]);
            const [messages, setMessages] = useState([
                {
                    sender: 'bot',
                    text: 'Hello! I\'m here to help you understand and fill out your NIE Assignment Cover Sheet and GAI Declaration. What would you like to know about?'
                }
            ]);
            const [currentMessage, setCurrentMessage] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [apiKey, setApiKey] = useState('');
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            const handleInputChange = (fieldId, value) => {
                setFormData(prev => ({
                    ...prev,
                    [fieldId]: value
                }));
            };

            const handleGAISelection = (optionId) => {
                setGaiSelections(prev => {
                    if (prev.includes(optionId)) {
                        return prev.filter(id => id !== optionId);
                    } else {
                        return [...prev, optionId];
                    }
                });
            };

            const handleSendMessage = async () => {
                if (!currentMessage.trim()) return;

                const userMessage = currentMessage.trim();
                setCurrentMessage('');
                
                setMessages(prev => [...prev, { sender: 'user', text: userMessage }]);
                setIsTyping(true);

                // Simulate bot response
                const botResponse = await callLLM(userMessage, apiKey);
                
                setTimeout(() => {
                    setIsTyping(false);
                    setMessages(prev => [...prev, { sender: 'bot', text: botResponse }]);
                }, 1000);
            };

            const handleQuickAction = async (action) => {
                const quickMessages = {
                    'explain-form': 'Can you explain what this Assignment Cover Sheet is for?',
                    'gai-help': 'What is the GAI Declaration and why do I need to fill it out?',
                    'academic-integrity': 'Can you explain the academic integrity requirements?',
                    'turnitin': 'What is Turnitin Similarity Index and what percentage is acceptable?',
                    'citation': 'How should I cite GAI assistance in my work?'
                };

                const message = quickMessages[action];
                if (message) {
                    setMessages(prev => [...prev, { sender: 'user', text: message }]);
                    setIsTyping(true);
                    
                    const botResponse = await callLLM(message, apiKey);
                    
                    setTimeout(() => {
                        setIsTyping(false);
                        setMessages(prev => [...prev, { sender: 'bot', text: botResponse }]);
                    }, 1000);
                }
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSendMessage();
                }
            };

            return (
                <>
                    {/* Navigation Header */}
                    <div className="nav-header">
                        <div style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
                            <img 
                                src="images/NTU_Logo.webp"
                                alt="NTU Logo" 
                            />
                            <a 
                                href="ai-assessment.html" 
                                className="nav-link"
                            >
                                ← Back to AI Assessment
                            </a>
                        </div>
                    </div>

                    {/* Header */}
                    <div className="header">
                        <h1>Interactive Form Assistant</h1>
                        <p>Get AI-powered help to understand and complete your NIE forms</p>
                    </div>

                    {/* Main Container */}
                    <div className="main-container">
                        {/* Form Section */}
                        <div className="form-section">
                            <h2 style={{color: '#003d7c', marginBottom: '20px'}}>Assignment Cover Sheet & GAI Declaration</h2>
                            
                            {/* Basic Information */}
                            <div className="form-preview">
                                <h3>Assignment Information</h3>
                                {formFields.map(field => (
                                    <div key={field.id} className="form-field">
                                        <label className="field-label">{field.label}:</label>
                                        <input
                                            type={field.type}
                                            className="field-input"
                                            value={formData[field.id] || ''}
                                            onChange={(e) => handleInputChange(field.id, e.target.value)}
                                            placeholder={`Enter ${field.label.toLowerCase()}`}
                                        />
                                    </div>
                                ))}
                            </div>

                            {/* Academic Integrity Declaration */}
                            <div className="declaration-section">
                                <h3>Academic Integrity Declaration</h3>
                                <p><strong>I/We have read and understood the NTU Student Academic Integrity (NIE Student version) document and declare that this assignment is my/our own work and does not violate Academic Integrity.</strong></p>
                                <ul>
                                    <li>The sources of other people's work and/or work produced by generative AI tool/s have been appropriately referenced or acknowledged</li>
                                    <li>Quotation marks are used around materials written verbatim from other sources</li>
                                    <li>I/We have not submitted any part of this assignment for another course</li>
                                </ul>
                            </div>

                            {/* GAI Declaration */}
                            <div className="form-preview">
                                <h3>Declaration on Use of GAI (Generative Artificial Intelligence) Assistance</h3>
                                <p>Please check all that apply to your assignment:</p>
                                {gaiDeclarationOptions.map(option => (
                                    <div key={option.id} className="checkbox-field">
                                        <input
                                            type="checkbox"
                                            id={option.id}
                                            checked={gaiSelections.includes(option.id)}
                                            onChange={() => handleGAISelection(option.id)}
                                        />
                                        <label htmlFor={option.id}>{option.text}</label>
                                    </div>
                                ))}
                                <div style={{marginTop: '15px', padding: '10px', background: '#f0f8ff', borderRadius: '4px'}}>
                                    <small><strong>Note:</strong> Please include an Appendix of your conversations with the GAI if you have checked any of the above options (except "No GAI assistance").</small>
                                </div>
                                
                                {/* Others about GenAI Usage */}
                                <div className="form-field" style={{marginTop: '20px'}}>
                                    <label className="field-label">More about My GenAI Usage:</label>
                                    <textarea
                                        className="field-input"
                                        value={formData.otherGAIUsage || ''}
                                        onChange={(e) => handleInputChange('otherGAIUsage', e.target.value)}
                                        placeholder="Please describe any other ways you used Generative AI in this assignment that are not covered by the options above..."
                                        rows="4"
                                        style={{
                                            minHeight: '80px',
                                            resize: 'vertical',
                                            fontFamily: 'inherit'
                                        }}
                                    />
                                    <small style={{display: 'block', marginTop: '5px', color: '#666', fontStyle: 'italic'}}>
                                        If you used GAI in ways not listed above, please provide details here including the specific AI tool used, how it was used, and the extent of its contribution to your work.
                                    </small>
                                </div>
                            </div>

                            {/* Signature Section */}
                            <div className="form-field">
                                <label className="field-label">Student's Signature:</label>
                                <input
                                    type="text"
                                    className="field-input"
                                    placeholder="Type your full name as digital signature"
                                />
                            </div>
                            <div className="form-field">
                                <label className="field-label">Date:</label>
                                <input
                                    type="date"
                                    className="field-input"
                                />
                            </div>
                        </div>

                        {/* Chat Section */}
                        <div className="chat-section">
                            <div className="chat-header">
                                <h3>AI Assistant</h3>
                                <p style={{margin: 0, fontSize: '0.9em', opacity: '0.9'}}>Ask me anything about the form</p>
                            </div>

                            {/* API Key Section */}
                            <div className="api-key-section">
                                <label style={{display: 'block', marginBottom: '5px', fontSize: '12px', fontWeight: 'bold'}}>
                                    OpenAI API Key (Optional):
                                </label>
                                <input
                                    type="password"
                                    className="api-key-input"
                                    placeholder="sk-..."
                                    value={apiKey}
                                    onChange={(e) => setApiKey(e.target.value)}
                                />
                                <small style={{display: 'block', marginTop: '5px', color: '#666'}}>
                                    Enter your API key to enable AI responses
                                </small>
                            </div>

                            <div className="chat-messages">
                                {messages.map((message, index) => (
                                    <div key={index} className={`message ${message.sender}-message`}>
                                        {message.text}
                                    </div>
                                ))}
                                {isTyping && (
                                    <div className="typing-indicator">
                                        AI is typing
                                        <div className="typing-dots">
                                            <span></span>
                                            <span></span>
                                            <span></span>
                                        </div>
                                    </div>
                                )}
                                <div ref={messagesEndRef} />
                            </div>

                            {/* Quick Actions */}
                            <div style={{padding: '15px 20px', borderBottom: '1px solid #eee'}}>
                                <div style={{fontSize: '12px', fontWeight: 'bold', marginBottom: '8px', color: '#666'}}>Quick Help:</div>
                                <div className="quick-actions">
                                    <button className="quick-action-btn" onClick={() => handleQuickAction('explain-form')}>
                                        What is this form?
                                    </button>
                                    <button className="quick-action-btn" onClick={() => handleQuickAction('gai-help')}>
                                        GAI Declaration help
                                    </button>
                                    <button className="quick-action-btn" onClick={() => handleQuickAction('academic-integrity')}>
                                        Academic integrity
                                    </button>
                                    <button className="quick-action-btn" onClick={() => handleQuickAction('turnitin')}>
                                        Turnitin help
                                    </button>
                                    <button className="quick-action-btn" onClick={() => handleQuickAction('citation')}>
                                        Citation guidelines
                                    </button>
                                </div>
                            </div>

                            <div className="chat-input-container">
                                <div style={{display: 'flex', alignItems: 'flex-end'}}>
                                    <textarea
                                        className="chat-input"
                                        value={currentMessage}
                                        onChange={(e) => setCurrentMessage(e.target.value)}
                                        onKeyPress={handleKeyPress}
                                        placeholder="Ask me about any part of the form..."
                                        rows="2"
                                    />
                                    <button className="send-button" onClick={handleSendMessage}>
                                        ➤
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </>
            );
        };

        const App = () => {
            return <FormAssistant />;
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
