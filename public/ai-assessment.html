            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f8f9fa;
        }
        
        .assessment-scale-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .level-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            border-left: 6px solid #ddd;
        }
        
        .level-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }
        
        .level-header {
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }
        
        .level-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2em;
            color: white;
            margin-right: 15px;
        }
        
        .level-title {
            flex: 1;
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }
        
        .expand-icon {
            font-size: 1.5em;
            transition: transform 0.3s ease;
            color: #666;
        }
        
        .expanded .expand-icon {
            transform: rotate(90deg);
        }
        
        .level-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out;
        }
        
        .level-content.expanded {
            max-height: 2000px;
        }
        
        .content-inner {
            padding: 0 20px 20px 20px;
        }
        
        .description {
            font-size: 1.1em;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }
        
        .guidelines-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        .guideline-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #007bff;
        }
        
        .guideline-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .examples-section {
            margin-top: 20px;
            background: #fff3cd;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #ffc107;
        }
        
        .examples-title {
            font-weight: 600;
            color: #856404;
            margin-bottom: 10px;
        }
        
        .example-item {
            margin: 8px 0;
            padding-left: 15px;
            position: relative;
        }
        
        .example-item:before {
            content: "•";
            position: absolute;
            left: 0;
            color: #856404;
            font-weight: bold;
        }
        
        .notes-section {
            background: #d4edda;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border-left: 4px solid #28a745;
        }
        
        .notes-title {
            font-weight: 600;
            color: #155724;
            margin-bottom: 8px;
        }
        
        .toggle-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }
        
        .toggle-button {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 1em;
        }
        
        .toggle-button.active {
            background: #003d7c;
            color: white;
            box-shadow: 0 4px 8px rgba(0, 61, 124, 0.3);
        }
        
        .toggle-button:not(.active) {
            background: #e9ecef;
            color: #6c757d;
        }
        
        .toggle-button:hover:not(.active) {
            background: #dee2e6;
        }
        
        .header {
            background: linear-gradient(135deg, #003d7c 0%, #0056b3 100%);
            color: white;
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 30px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 700;
        }

            margin: 10px 0 0 0;
            font-size: 1.2em;

        // User Experience Database Service (same as main page)
        const UserExperienceDB = {
            _storageMode: localStorage.getItem('ntu_storage_mode') || 'local',
            
            setStorageMode: (mode) => {
                if (mode !== 'local' && mode !== 'server') {
                    console.error('Invalid storage mode. Must be "local" or "server"');
                    return false;
                }
                UserExperienceDB._storageMode = mode;
                localStorage.setItem('ntu_storage_mode', mode);
                console.log(`Storage mode set to: ${mode}`);
                return true;
            },
            
            getStorageMode: () => UserExperienceDB._storageMode,
            
            _getStoredData: (key) => {
                try {
                    const storedData = localStorage.getItem(key);
                    return storedData ? JSON.parse(storedData) : [];
                } catch (error) {
                    console.error(`Error retrieving ${key} from localStorage:`, error);
                    return [];
                }
            },
            
            _storeData: (key, data) => {
                try {
                    const existingData = UserExperienceDB._getStoredData(key);
                    existingData.push({...data, storedAt: new Date().toISOString()});
                    localStorage.setItem(key, JSON.stringify(existingData));
                    return true;
                } catch (error) {
                    console.error(`Error storing ${key} in localStorage:`, error);
                    return false;
                }
            },
            
            _sendToServer: async (endpoint, data) => {
                try {
                    const response = await fetch(`http://localhost:3001/api/${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data),
                    });
                    return await response.json();
                } catch (error) {
                    console.error(`Error sending data to server (${endpoint}):`, error);
                    console.log('Falling back to localStorage for storage');
                    UserExperienceDB.setStorageMode('local');
                    return { success: false, error: error.message };
                }
            },
            
            storeUserFeedback: async (feedbackData) => {
                try {
                    console.log('Storing user feedback:', feedbackData);
                    if (UserExperienceDB._storageMode === 'server') {
                        return await UserExperienceDB._sendToServer('save-data', {
                            dataType: 'feedback',
                            data: feedbackData
                        });
                    } else {
                        UserExperienceDB._storeData('ntu_user_feedback', feedbackData);
                        return { success: true, id: `feedback_${Date.now()}` };
                    }
                } catch (error) {
                    console.error('Error storing user feedback:', error);
                    return { success: false, error: error.message };
                }
            },
            
            logNavigation: async (navigationData) => {
                try {
                    console.log('Logging user navigation:', navigationData);
                    if (UserExperienceDB._storageMode === 'server') {
                        return await UserExperienceDB._sendToServer('save-data', {
                            dataType: 'navigation',
                            data: navigationData
                        });
                    } else {
                        UserExperienceDB._storeData('ntu_navigation_logs', navigationData);
                        return { success: true, id: `nav_${Date.now()}` };
                    }
                } catch (error) {
                    console.error('Error logging navigation:', error);
                    return { success: false, error: error.message };
                }
            },
            
            storeConversation: async (conversationData) => {
                try {
                    console.log('Storing chat conversation:', conversationData);
                    if (UserExperienceDB._storageMode === 'server') {
                        return await UserExperienceDB._sendToServer('save-data', {
                            dataType: 'conversation',
                            data: conversationData
                        });
                    } else {
                        UserExperienceDB._storeData('ntu_conversations', conversationData);
                        return { success: true, id: `conv_${Date.now()}` };
                    }
                } catch (error) {
                    console.error('Error storing conversation:', error);
                    return { success: false, error: error.message };
                }
            },
            
            storeSession: async (sessionData) => {
                try {
                    console.log('Storing user session data:', sessionData);
                    if (UserExperienceDB._storageMode === 'server') {
                        return await UserExperienceDB._sendToServer('save-data', {
                            dataType: 'session',
                            data: sessionData
                        });
                    } else {
                        if (sessionData.endTime) {
                            const sessions = UserExperienceDB._getStoredData('ntu_sessions');
                            const sessionIndex = sessions.findIndex(s => s.sessionId === sessionData.sessionId);
                            if (sessionIndex >= 0) {
                                sessions[sessionIndex] = {...sessions[sessionIndex], ...sessionData, updatedAt: new Date().toISOString()};
                                localStorage.setItem('ntu_sessions', JSON.stringify(sessions));
                            } else {
                                UserExperienceDB._storeData('ntu_sessions', sessionData);
                            }
                        } else {
                            UserExperienceDB._storeData('ntu_sessions', sessionData);
                        }
                        return { success: true, id: sessionData.sessionId || `session_${Date.now()}` };
                    }
                } catch (error) {
                    console.error('Error storing session data:', error);
                    return { success: false, error: error.message };
                }
            },
            
            saveCompleteSession: async (sessionData) => {
                try {
                    console.log('Saving complete session data:', sessionData);
                    if (UserExperienceDB._storageMode === 'server') {
                        try {
                            const response = await fetch('http://localhost:3001/api/save-session', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ sessionData }),
                            });
                            if (!response.ok) {
                                throw new Error(`Server error: ${response.status} ${response.statusText}`);
                            }
                            const result = await response.json();
                            console.log('Server response:', result);
                            return result;
                        } catch (error) {
                            console.error('Error sending to server:', error);
                            const key = 'ntu_complete_sessions';
                            const existingData = UserExperienceDB._getStoredData(key);
                            existingData.push({...sessionData, storedAt: new Date().toISOString()});
                            localStorage.setItem(key, JSON.stringify(existingData));
                            return { success: true, message: 'Session data saved to localStorage (fallback)', id: `session_${Date.now()}` };
                        }
                    } else {
                        const key = 'ntu_complete_sessions';
                        const existingData = UserExperienceDB._getStoredData(key);
                        existingData.push({...sessionData, storedAt: new Date().toISOString()});
                        localStorage.setItem(key, JSON.stringify(existingData));
                        return { success: true, id: `session_${Date.now()}` };
                    }
                } catch (error) {
                    console.error('Error saving complete session:', error);
                    return { success: false, error: error.message };
                }
            }
        };

        const TextCitationSelector = () => {
            const [isVisible, setIsVisible] = useState(false);
            const [position, setPosition] = useState({ top: 0, left: 0 });
            const [selectedText, setSelectedText] = useState('');
            const [isCitationDialogOpen, setIsCitationDialogOpen] = useState(false);
            
            useEffect(() => {
                const handleTextSelection = () => {
                    const selection = window.getSelection();
                    const selectedText = selection.toString().trim();
                    
                    if (selectedText.length > 0) {
                        const range = selection.getRangeAt(0);
                        const rect = range.getBoundingClientRect();
                        
                        setSelectedText(selectedText);
                        setPosition({
                            top: rect.bottom + window.scrollY,
                            left: rect.left + rect.width / 2 + window.scrollX,
                        });
                        setIsVisible(true);
                    } else {
                        setIsVisible(false);

            const handleInterestSelection = (option) => {
                const { text, value } = option;

                let responseText = '';

                        responseText = "The AI Assessment Scale has 5 levels:\n\n• Level 1: NO AI - Complete prohibition\n• Level 2: AI-ASSISTED IDEA GENERATION - Planning only\n• Level 3: AI-ASSISTED EDITING - Improvements only\n• Level 4: AI TASK COMPLETION - With evaluation\n• Level 5: FULL AI - Collaborative partnership\n\nEach level has specific permitted and conditional uses. Would you like details about any specific level?";
                        break;
                    case 'implementation':
                        responseText = "To implement the AIAS effectively:\n\n1. Choose the appropriate level for your learning objectives\n2. Clearly communicate expectations to students\n3. Provide specific guidelines and examples\n4. Create assessment rubrics aligned with the chosen level\n5. Consider detection and verification methods\n\nWhich aspect would you like to explore further?";
                        break;
                    case 'understanding-levels':
                        responseText = "Each level represents increasing AI integration:\n\n• Levels 1-2: Traditional approach with minimal AI\n• Level 3: Controlled AI use for improvement\n• Levels 4-5: Collaborative AI partnership\n\nThe key is understanding what's permitted vs. what requires conditions at each level. Which level are you most curious about?";
                        break;
                    case 'appropriate-use':
                        responseText = "Appropriate AI use depends on your assignment's level:\n\n• Always check the level specified by your instructor\n• Follow permitted use guidelines exactly\n• Meet all conditional requirements (like citations)\n• When in doubt, ask your instructor\n• Keep records of your AI interactions\n\nWould you like examples for a specific level?";
                        break;
                    default:
                        responseText = `I'll help you with ${text}. Please feel free to ask any specific questions!`;
                }
                
                setTimeout(() => {
                    setBotTyping(false);
                    setMessages(prev => [...prev, { text: responseText, sender: 'bot' }]);
                }, 1500);
            };

            // Get OpenAI response
            const getOpenAIResponse = async (userInput, chatHistory) => {
                const apiKey = llmApiKey;
                if (!apiKey) {
                    throw new Error("OpenAI API Key is not set.");
                }

                const systemMessage = {
                    role: "system",
                    content: "You are an AI Assessment Scale (AIAS) assistant. Help users understand the 5-level framework for implementing AI in educational assessments. Provide clear, practical guidance about permitted uses, conditional requirements, and implementation strategies for each level."
                };
                
                const formattedMessages = [
                    systemMessage,
                    ...chatHistory.map(msg => ({
                        role: msg.sender === 'user' ? 'user' : 'assistant',
                        content: msg.text
                    })),
                    { role: 'user', content: userInput }
                ];

                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4-turbo',
                        messages: formattedMessages,
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `API request failed with status ${response.status}`);
                }

                const data = await response.json();
                const choice = data.choices && data.choices[0];
                return choice?.message?.content || "Sorry, I couldn't retrieve a valid response from the AI.";

                                                        key={i}

                                                            padding: '8px 12px',
                                                            backgroundColor: '#003d7c',
                                                            color: 'white',
                                                            border: 'none',
                                                            borderRadius: '16px',
                                                            cursor: 'pointer',
                                                            fontSize: '0.9em',
                                                            transition: 'all 0.2s ease',
                                                        }}

                                                        {option.text}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                        <div 
                                            key={index} 
                                            style={msg.sender === 'user' ? dialogStyles.userMessage : dialogStyles.botMessage}
                                        >
                                            {msg.text.split('\n').map((line, i) => (
                                                <React.Fragment key={i}>
                                                    {line}
                                                    {i < msg.text.split('\n').length - 1 && <br />}
                                                </React.Fragment>
                                            ))}
                                        </div>
                                    )
                                ))}
                                
                                {botTyping && (
                                    <div style={dialogStyles.typingIndicator}>
                                        <div style={{...dialogStyles.dot, animationDelay: '0s'}}></div>
                                        <div style={{...dialogStyles.dot, animationDelay: '0.2s'}}></div>
                                        <div style={{...dialogStyles.dot, animationDelay: '0.4s'}}></div>
                                    </div>
                                )}
                                
                                <div ref={messagesEndRef} />
                            </div>
                            
                            {renderRoleSelection()}
                            
                            {userRole && (
                                <div style={dialogStyles.dialogInputContainer}>
                                    {quotedText && (
                                        <div style={{
                                            backgroundColor: '#f0f7ff',
                                            padding: '10px 15px',
                                            borderRadius: '8px',
                                            marginBottom: '10px',
                                            border: '1px solid #d0e3ff',
                                            position: 'relative',
                                            fontSize: '14px'
                                        }}>
                                            <div style={{
                                                display: 'flex',
                                                justifyContent: 'space-between',
                                                alignItems: 'center',
                                                marginBottom: '5px'
                                            }}>

                                                    onClick={() => setQuotedText(null)}

                                                        background: 'none',
                                                        border: 'none',
                                                        cursor: 'pointer',
                                                        color: '#666',
                                                        fontSize: '16px',
                                                        padding: '0 5px'
                                                    }}
                                                >
                                                    ×
                                                </button>
                                            </div>
                                            <div style={{ 
                                                maxHeight: '80px', 
                                                overflowY: 'auto',
                                                fontStyle: 'italic',
                                                color: '#444',
                                                padding: '0 5px'
                                            }}>
                                                "{quotedText}"
                                            </div>
                                        </div>
                                    )}
                                    
                                    <div style={dialogStyles.messageInputContainerStyle}>
                                        <input
                                            type="text"
                                            value={inputValue}
                                            onChange={handleInputChange}
                                            onKeyPress={(e) => e.key === 'Enter' && handleSendMessage(e)}

                                            style={dialogStyles.dialogInput}
                                        />
                                        <button
                                            onClick={handleSendMessage}
                                            aria-label="Send message"
                                            title="Send message"
                                            style={dialogStyles.sendButton}
                                        >
                                            Send
                                        </button>
                                    </div>
                                    
                                    <div style={dialogStyles.apiKeyContainer}>
                                        <label htmlFor="apiKeyInput" style={dialogStyles.apiKeyLabel}>API Key:</label>
                                        <input
                                            id="apiKeyInput"
                                            type="password"
                                            value={llmApiKey}
                                            onChange={(e) => setLlmApiKey(e.target.value)}
                                            placeholder="Enter your OpenAI API Key"
                                            aria-label="OpenAI API Key"
                                            style={dialogStyles.apiKeyInput}
                                        />
                                    </div>
                                </div>
                            )}
                        </>
                    )}
                </div>
            );
        };

        const AIAssessmentScale = () => {
            const [userType, setUserType] = useState('student');
            const [expandedLevels, setExpandedLevels] = useState({});

            const toggleLevel = (levelNum) => {
                setExpandedLevels(prev => ({
                    ...prev,
                    [levelNum]: !prev[levelNum]
                }));
            };

            const expandAll = () => {
                const allExpanded = {};
                assessmentLevels[userType].forEach(level => {
                    allExpanded[level.level] = true;
                });
                setExpandedLevels(allExpanded);
            };

            const collapseAll = () => {
                setExpandedLevels({});
            };

            return (
                <div>
                    {/* Navigation Header */}
                    <div style={{
                        background: '#fff',
                        padding: '10px 20px',
                        borderBottom: '1px solid #e0e0e0',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'space-between'
                    }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
                            <img 
                                src="images/NTU_Logo.webp"
                                alt="NTU Logo" 
                                style={{ height: '40px', width: 'auto' }}
                            />
                            <a 
                                href="index.html" 
                                style={{
                                    color: '#003d7c',
                                    textDecoration: 'none',
                                    fontWeight: '600',
                                    fontSize: '1em',
                                    padding: '8px 16px',
                                    border: '1px solid #003d7c',
                                    borderRadius: '4px',
                                    transition: 'all 0.2s ease'
                                }}
                                onMouseOver={(e) => {
                                    e.target.style.backgroundColor = '#003d7c';
                                    e.target.style.color = 'white';
                                }}
                                onMouseOut={(e) => {
                                    e.target.style.backgroundColor = 'transparent';
                                    e.target.style.color = '#003d7c';
                                }}
                            >
                                ← Back to Main Portal
                            </a>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
                            <a 
                                href="form-assistant.html" 
                                style={{
                                    color: '#28a745',
                                    textDecoration: 'none',
                                    fontWeight: '600',
                                    fontSize: '1em',
                                    padding: '8px 16px',
                                    border: '1px solid #28a745',
                                    borderRadius: '4px',
                                    transition: 'all 0.2s ease',
                                    background: 'linear-gradient(135deg, #28a745 0%, #20c997 100%)',
                                    color: 'white'
                                }}
                                onMouseOver={(e) => {
                                    e.target.style.backgroundColor = '#20c997';
                                    e.target.style.borderColor = '#20c997';
                                }}
                                onMouseOut={(e) => {
                                    e.target.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';
                                    e.target.style.borderColor = '#28a745';
                                }}
                            >
                                📋 Interactive Form Assistant
                            </a>
                        </div>
                    </div>
                    
                    <div className="header">
                        <h1>AI Assessment Scale (AIAS)</h1>
                        <p>Interactive guide for implementing AI in educational assessments</p>
                    </div>
                    
                    <div className="assessment-scale-container">
                        <div className="toggle-buttons">
                            <button 
                                className={`toggle-button ${userType === 'student' ? 'active' : ''}`}
                                onClick={() => setUserType('student')}
                            >
                                👨‍🎓 Student View
                            </button>
                            <button 
                                className={`toggle-button ${userType === 'teacher' ? 'active' : ''}`}
                                onClick={() => setUserType('teacher')}
                            >
                                👩‍🏫 Teacher View
                            </button>
                        </div>

                        <div style={{textAlign: 'center', marginBottom: '20px'}}>
                            <button 
                                onClick={expandAll}
                                style={{
                                    padding: '8px 16px',
                                    margin: '0 5px',
                                    border: 'none',
                                    borderRadius: '4px',
                                    background: '#6c757d',
                                    color: 'white',
                                    cursor: 'pointer'
                                }}
                            >
                                Expand All
                            </button>
                            <button 
                                onClick={collapseAll}
                                style={{
                                    padding: '8px 16px',
                                    margin: '0 5px',
                                    border: 'none',
                                    borderRadius: '4px',
                                    background: '#6c757d',
                                    color: 'white',
                                    cursor: 'pointer'
                                }}
                            >
                                Collapse All
                            </button>
                        </div>

                        {assessmentLevels[userType].map((level) => (
                            <LevelCard 
                                key={level.level}
                                level={level}
                                isExpanded={expandedLevels[level.level] || false}
                                onToggle={() => toggleLevel(level.level)}
                                userType={userType}
                            />
                        ))}

                        <div style={{
                            background: 'white',
                            borderRadius: '12px',
                            padding: '20px',
                            marginTop: '30px',
                            boxShadow: '0 4px 6px rgba(0, 0, 0, 0.1)',
                            textAlign: 'center'
                        }}>
                            <h3 style={{color: '#003d7c', margin: '0 0 15px 0'}}>Quick Reference</h3>
                            <p>Use this scale to determine the appropriate level of AI assistance for your assessments. Each level builds upon the previous one, offering increasing integration of AI tools while maintaining educational integrity.</p>
                            
                            <div style={{
                                display: 'grid',
                                gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))',
                                gap: '15px',
                                marginTop: '20px'
                            }}>
                                <div style={{background: '#f8f9fa', padding: '15px', borderRadius: '8px'}}>
                                    <strong>🚫 Level 1-2</strong><br/>
                                    Traditional Assessment
                                </div>
                                <div style={{background: '#f8f9fa', padding: '15px', borderRadius: '8px'}}>
                                    <strong>⚖️ Level 3</strong><br/>
                                    Controlled AI Use
                                </div>
                                <div style={{background: '#f8f9fa', padding: '15px', borderRadius: '8px'}}>
                                    <strong>🤝 Level 4-5</strong><br/>
                                    AI Collaboration
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    {/* Footer */}
                    <div style={{
                        background: '#f1f1f1',
                        padding: '30px',
                        textAlign: 'center',
                        fontSize: '0.9em',
                        borderTop: '1px solid #ddd',
                        marginTop: '40px'
                    }}>
                        <div style={{
                            display: 'flex',
                            justifyContent: 'center',
                            gap: '25px',
                            marginBottom: '15px'
                        }}>
                            <a href="index.html" style={{ color: '#333', textDecoration: 'none' }}>Main Portal</a>
                            <a href="form-assistant.html" style={{ color: '#28a745', textDecoration: 'none', fontWeight: 'bold' }}>📋 Form Assistant</a>
                            <a href="literature-review.html" style={{ color: '#333', textDecoration: 'none' }}>Literature Review</a>
                            <a href="findings.html" style={{ color: '#333', textDecoration: 'none' }}>Findings</a>
                            <a href="case-studies.html" style={{ color: '#333', textDecoration: 'none' }}>Case Studies</a>

                        <div>© {new Date().getFullYear()} NIE_AI4Edx - AI Assessment Scale</div>
                    </div>
                </div>
            );
        };

        // Main App Component that includes chatbot functionality
        const App = () => {
            const [isDialogOpen, setIsDialogOpen] = useState(false);
            const [sessionId, setSessionId] = useState(`session_${Date.now()}`);
            const [userSessionData, setUserSessionData] = useState({
                startTime: new Date().toISOString(),
                sections: ['ai-assessment'],
                interactions: 0
            });
            const [llmApiKey, setLlmApiKey] = useState('');

            useEffect(() => {
                // Initialize user session for AI Assessment page
                const initUserSession = async () => {
                    await UserExperienceDB.storeSession({
                        sessionId,
                        startTime: userSessionData.startTime,
                        userAgent: navigator.userAgent,
                        platform: navigator.platform,
                        referrer: document.referrer || 'direct',
                        page: 'ai-assessment'
                    });
                };
                
                initUserSession();
                
                // Auto-show chatbot after user scrolls through some content
                const handleScroll = () => {
                    const scrollPercent = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;
                    if (scrollPercent > 30) { // Show after 30% scroll
                        setTimeout(() => {
                            setIsDialogOpen(true);
                        }, 3000);
                        window.removeEventListener('scroll', handleScroll);
                    }
                };
                
                window.addEventListener('scroll', handleScroll);
                
                // Clean up on unmount
                return () => {
                    window.removeEventListener('scroll', handleScroll);
                    
                    // Store final session data
                    UserExperienceDB.storeSession({
                        sessionId,
                        endTime: new Date().toISOString(),
                        sections: userSessionData.sections,
                        interactions: userSessionData.interactions,
                        page: 'ai-assessment'
                    });
                };
            }, [sessionId, userSessionData.startTime, userSessionData.sections, userSessionData.interactions]);

            const handleOpenDialog = () => {
                setIsDialogOpen(true);
            };

            const handleCloseDialog = () => {
                setIsDialogOpen(false);
            };

            const updateUserSessionData = (data) => {
                setUserSessionData(prev => ({
                    ...prev, 
                    ...data,
                    interactions: prev.interactions + 1
                }));
            };

            return (
                <>
                    <AIAssessmentScale />
                    <FloatingButton onClick={handleOpenDialog} />
                    <TextCitationSelector />
                    {isDialogOpen && (
                        <Dialog 
                            isOpen={true} 
                            onClose={handleCloseDialog} 
                            sessionId={sessionId}
                            updateUserSessionData={updateUserSessionData}
                            llmApiKey={llmApiKey}
                            setLlmApiKey={setLlmApiKey}
                        />
                    )}
                    
                    {/* Add CSS animations */}
                    <style dangerouslySetInnerHTML={{
                        __html: `
                            @keyframes bounce {
                                0%, 80%, 100% { transform: translateY(0); }
                                40% { transform: translateY(-5px); }
                            }
                            
                            @keyframes fadeIn {
                                from { opacity: 0; }
                                to { opacity: 1; }
                            }
                            
                            @keyframes fadeInLeft {
                                from { 
                                    opacity: 0;
                                    transform: translateX(-10px);
                                }
                                to { 
                                    opacity: 1;
                                    transform: translateX(0);
                                }
                            }
                            
                            @keyframes fadeInRight {
                                from { 
                                    opacity: 0;
                                    transform: translateX(10px);
                                }
                                to { 
                                    opacity: 1;
                                    transform: translateX(0);
                                }
                            }
                            
                            /* Text selection animations */
                            @keyframes slideInUp {
                                from {
                                    opacity: 0;
                                    transform: translate(-50%, 10px);
                                }
                                to {
                                    opacity: 1;
                                    transform: translate(-50%, 0);
                                }
                            }
                        `
                    }} />
                </>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
